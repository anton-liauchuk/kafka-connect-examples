[versions]
kafkaConnect="8.3.2-ccs"
jakartaWsRsApi = "3.1.0"
jerseyCommon = "3.1.12"
assertj = "3.27.7"
junit = "6.1.3"
mockito = "5.23.0"
httpClient = "5.6.4"
testcontainers = "2.0.5"
kafkaConnectJdbc = "10.9.6"
jacksonDatabind = "2.21.6"

[libraries]
connect-api = { group = "org.apache.kafka", name = "connect-api", version.ref = "kafkaConnect" }
connect-runtime = { group = "org.apache.kafka", name = "connect-runtime", version.ref = "kafkaConnect" }
connect-transforms = { group = "org.apache.kafka", name = "connect-transforms", version.ref = "kafkaConnect" }
kafka-clients = { group = "org.apache.kafka", name = "kafka-clients", version.ref = "kafkaConnect" }
jakarta-ws-rs-api = { group = "jakarta.ws.rs", name = "jakarta.ws.rs-api", version.ref = "jakartaWsRsApi" }
jersey-common = { group = "org.glassfish.jersey.core", name = "jersey-common", version.ref = "jerseyCommon" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
testcontainers = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers" }
testcontainers-kafka = { group = "org.testcontainers", name = "testcontainers-kafka", version.ref = "testcontainers" }
testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
httpclient5 = { group = "org.apache.httpcomponents.client5", name = "httpclient5", version.ref = "httpClient" }
kafka-connect-jdbc = { group = "io.confluent", name = "kafka-connect-jdbc", version.ref = "kafkaConnectJdbc" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jacksonDatabind" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
